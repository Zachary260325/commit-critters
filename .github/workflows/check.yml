name: Check the farm

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  critter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tests -v
      - run: python critters.py --demo
      - run: python critters.py --quests
      - run: python critters.py
